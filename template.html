<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCAA Football Computer Rankings</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background: radial-gradient(circle at top, #f8fafc 0%, #e2e8f0 100%);
            color: #0f172a;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .dashboard {
            width: 100%;
            max-width: 1300px;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
            backdrop-filter: blur(12px);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 25px;
            margin-bottom: 30px;
        }

        .title-area h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            color: #0f172a;
        }

        .title-area p {
            color: #64748b;
            font-size: 14px;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .meta-tag {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1d4ed8;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
        }

        .columns-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .table-header {
            display: grid;
            grid-template-columns: 50px 1fr 80px 70px 80px;
            padding: 10px 16px;
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 2px solid #f1f5f9;
        }

        .table-header .text-right {
            text-align: right;
        }

        .rows-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .table-row {
            display: grid;
            grid-template-columns: 50px 1fr 80px 70px 80px;
            align-items: center;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            padding: 12px 16px;
            border-radius: 12px;
            position: relative;
            transition: all 0.2s ease;
        }

        .table-row:hover {
            background: #f1f5f9;
            border-color: #d1d5db;
            transform: translateX(3px);
        }

        .rank-border {
            position: absolute;
            left: 0;
            top: 10px;
            bottom: 10px;
            width: 4px;
            border-radius: 0 4px 4px 0;
        }

        .rank {
            font-weight: 800;
            font-size: 16px;
            color: #475569;
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
        }

        .team-name {
            font-weight: 700;
            font-size: 15px;
            color: #0f172a;
        }

        .record {
            font-weight: 600;
            font-size: 14px;
            color: #64748b;
        }

        @media (max-width: 900px) {
            .columns-container {
                grid-template-columns: 1fr;
                gap: 25px;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <header>
            <div class="title-area">
                <h1>Ron's NCAA Model</h1>
                <p>NCAA Football Top 25</p>
            </div>
            <div class="meta-tag">Following week {{ current_week }}</div>
        </header>

        <div class="columns-container">
            <!-- Left Column: 1 to 13 -->
            <div>
                <div class="table-header">
                    <div>Rank</div>
                    <div>Team</div>
                    <div>Record</div>
                </div>
                <div class="rows-list">
                    {{ left_rows }}
                </div>
            </div>

            <!-- Right Column: 14 to 25 -->
            <div>
                <div class="table-header">
                    <div>Rank</div>
                    <div>Team</div>
                    <div>Record</div>
                </div>
                <div class="rows-list">
                    {{ right_rows }}
                </div>
            </div>
        </div>
    </div>

</body>
</html>
